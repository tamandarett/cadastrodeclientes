<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    
    <title>Cadastro e Retirada - Tamandaré Tintas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #f4f6f9; }
        .card-form {
            max-width: 800px;
            margin: 40px auto;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 12px;
        }
        .form-section-title {
            color: #0d6efd; 
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 10px;
            margin-bottom: 20px;
            margin-top: 20px;
            font-weight: 600;
        }
        .required-asterisk { color: red; font-weight: bold; }
        .logo-header { max-height: 80px; width: auto; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card card-form p-4 p-md-5">
            <div class="text-center mb-4">
                <img src="logo.png" alt="Tamandaré Tintas" class="img-fluid mb-3 logo-header">
                <h4 class="text-muted">Cadastro de Cliente e Autorização de Retirada</h4>
            </div>

            <form id="cadastroForm" autocomplete="off">
                
                <h5 class="form-section-title">1. Dados do Cliente</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="cpf" class="form-label">CPF <span class="required-asterisk">*</span></label>
                        <input type="text" class="form-control" id="cpf" placeholder="000.000.000-00" required>
                        <div class="invalid-feedback" id="cpf-error">CPF inválido. Verifique o número digitado.</div>
                    </div>
                    <div class="col-md-6">
                        <label for="rg" class="form-label">RG</label>
                        <input type="text" class="form-control" id="rg" placeholder="Opcional">
                    </div>
                    <div class="col-md-8">
                        <label for="nome" class="form-label">Nome Completo <span class="required-asterisk">*</span></label>
                        <input type="text" class="form-control" id="nome" required>
                    </div>
                    <div class="col-md-4">
                        <label for="nascimento" class="form-label">Data de Nascimento <span class="required-asterisk">*</span></label>
                        <input type="date" class="form-control" id="nascimento" required>
                    </div>
                    <div class="col-md-12">
                        <label for="email" class="form-label">E-mail <span class="required-asterisk">*</span></label>
                        <input type="email" class="form-control" id="email" placeholder="Para onde enviaremos o contrato para assinatura" required>
                    </div>
                    <div class="col-md-6">
    <label for="email" class="form-label">E-mail <span class="required-asterisk">*</span></label>
    <input type="email" class="form-control" id="email" placeholder="Seu melhor e-mail" required>
</div>
<div class="col-md-6">
    <label for="emailConfirm" class="form-label">Confirme seu E-mail <span class="required-asterisk">*</span></label>
    <input type="email" class="form-control" id="emailConfirm" placeholder="Digite novamente" required>
    <div class="invalid-feedback">Os e-mails não conferem.</div>
</div>
                </div>

                <h5 class="form-section-title">2. Endereço</h5>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="cep" class="form-label">CEP <span class="required-asterisk">*</span></label>
                        <input type="text" class="form-control" id="cep" placeholder="00000-000" required>
                        <small id="cep-status" class="text-primary"></small>
                    </div>
                    <div class="col-md-8">
                        <label for="rua" class="form-label">Rua / Avenida <span class="required-asterisk">*</span></label>
                        <input type="text" class="form-control" id="rua" required>
                    </div>
                    <div class="col-md-4">
                        <label for="numero" class="form-label">Número <span class="required-asterisk">*</span></label>
                        <input type="text" class="form-control" id="numero" required>
                    </div>
                    <div class="col-md-4">
                        <label for="bairro" class="form-label">Bairro <span class="required-asterisk">*</span></label>
                        <input type="text" class="form-control" id="bairro" required>
                    </div>
                    <div class="col-md-4">
                        <label for="cidade" class="form-label">Cidade <span class="required-asterisk">*</span></label>
                        <input type="text" class="form-control" id="cidade" required>
                    </div>
                </div>

                <h5 class="form-section-title">3. Autorização de Retirada por Terceiros (Opcional)</h5>
                <p class="text-muted small">Preencha apenas se outra pessoa for retirar a mercadoria na loja.</p>
                <div class="row g-3">
                    <div class="col-md-12">
                        <label for="nomeAuth" class="form-label">Nome da Pessoa Autorizada</label>
                        <input type="text" class="form-control" id="nomeAuth" placeholder="Ex: Motorista, Familiar, Empreiteiro">
                    </div>
                    <div class="col-md-6">
                        <label for="cpfAuth" class="form-label">CPF da Pessoa Autorizada</label>
                        <input type="text" class="form-control" id="cpfAuth" placeholder="000.000.000-00">
                    </div>
                    <div class="col-md-6">
                        <label for="dataLimite" class="form-label">Autorizada até a data:</label>
                        <input type="date" class="form-control" id="dataLimite">
                    </div>
                </div>

                <h5 class="form-section-title">4. Segurança e Privacidade</h5>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="lgpdCheck" required>
                    <label class="form-check-label" for="lgpdCheck">
                        Eu li e aceito as 
                        <a href="#" onclick="abrirPoliticaPopup(); return false;" class="text-primary fw-bold">Políticas da Loja e Termos de Retirada</a>. 
                        Autorizo a utilização dos meus dados exclusivamente para fins comerciais com a Tamandaré Tintas, conforme a Lei Geral de Proteção de Dados (LGPD).
                    </label>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg" id="btnEnviar">
                        <i class="fas fa-paper-plane"></i> Enviar Cadastro
                    </button>
                </div>

            </form>
        </div>
    </div>

    <script src="https://unpkg.com/imask"></script>
    
    <script>
        // 1. APLICANDO MÁSCARAS
        IMask(document.getElementById('cpf'), { mask: '000.000.000-00' });
        IMask(document.getElementById('cpfAuth'), { mask: '000.000.000-00' });
        IMask(document.getElementById('cep'), { mask: '00000-000' });

        // 2. FUNÇÃO: ABRIR POLÍTICA EM POPUP
        function abrirPoliticaPopup() {
            const width = 800;
            const height = 600;
            const left = (window.screen.width - width) / 2;
            const top = (window.screen.height - height) / 2;
            window.open('politica.html', 'PoliticaPopup', `width=${width},height=${height},top=${top},left=${left},scrollbars=yes,status=no,toolbar=no,menubar=no,location=no`);
        }

        // 3. FUNÇÃO: VALIDADOR REAL DE CPF (MÓDULO 11)
        function testarCPF(strCPF) {
            var Soma;
            var Resto;
            Soma = 0;
            strCPF = strCPF.replace(/[^\d]+/g, ''); // Remove pontos e traços

            if (strCPF == "00000000000" || strCPF == "11111111111" || strCPF == "22222222222" || strCPF == "33333333333" || 
                strCPF == "44444444444" || strCPF == "55555555555" || strCPF == "66666666666" || strCPF == "77777777777" || 
                strCPF == "88888888888" || strCPF == "99999999999" || strCPF.length !== 11) return false;

            for (i = 1; i <= 9; i++) Soma = Soma + parseInt(strCPF.substring(i - 1, i)) * (11 - i);
            Resto = (Soma * 10) % 11;

            if ((Resto == 10) || (Resto == 11)) Resto = 0;
            if (Resto != parseInt(strCPF.substring(9, 10))) return false;

            Soma = 0;
            for (i = 1; i <= 10; i++) Soma = Soma + parseInt(strCPF.substring(i - 1, i)) * (12 - i);
            Resto = (Soma * 10) % 11;

            if ((Resto == 10) || (Resto == 11)) Resto = 0;
            if (Resto != parseInt(strCPF.substring(10, 11))) return false;
            return true;
        }

        // EVENTO: Validar CPF ao sair do campo
        const cpfInput = document.getElementById('cpf');
        cpfInput.addEventListener('blur', function() {
            if (this.value.length > 0) {
                if (!testarCPF(this.value)) {
                    this.classList.add('is-invalid');
                    document.getElementById('btnEnviar').disabled = true; // Bloqueia o envio
                } else {
                    this.classList.remove('is-invalid');
                    this.classList.add('is-valid');
                    document.getElementById('btnEnviar').disabled = false; // Libera o envio
                }
            }
        });

        // 4. AUTOMAÇÃO: BUSCA DE ENDEREÇO PELO CEP
        const cepInput = document.getElementById('cep');
        cepInput.addEventListener('blur', function() {
            let cep = this.value.replace(/\D/g, ''); 
            if (cep.length === 8) {
                document.getElementById('cep-status').innerText = "Buscando endereço...";
                
                fetch(`https://viacep.com.br/ws/${cep}/json/`)
                .then(response => response.json())
                .then(data => {
                    if(data.erro) {
                        document.getElementById('cep-status').innerText = "CEP não encontrado. Digite manualmente.";
                        document.getElementById('cep-status').classList.replace('text-primary', 'text-danger');
                    } else {
                        document.getElementById('rua').value = data.logradouro;
                        document.getElementById('bairro').value = data.bairro;
                        document.getElementById('cidade').value = data.localidade + ' - ' + data.uf;
                        document.getElementById('cep-status').innerText = "";
                        document.getElementById('numero').focus(); 
                    }
                });
            }
        });

        // 5. SIMULAÇÃO DO ENVIO (Impede envio com CPF inválido)
        document.getElementById('cadastroForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            if (!testarCPF(document.getElementById('cpf').value)) {
                alert("Por favor, corrija o CPF antes de enviar.");
                return;
            }

            const btn = document.getElementById('btnEnviar');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Processando e enviando e-mail...';
            btn.disabled = true;

            setTimeout(() => {
                alert("SUCESSO! Simulação concluída. O cliente receberia agora o e-mail para assinatura.");
                btn.innerHTML = '<i class="fas fa-check"></i> Dados Enviados';
                btn.classList.replace('btn-primary', 'btn-success');
            }, 2000);
        });
        // EVENTO: Verificar se os e-mails são iguais
const emailInput = document.getElementById('email');
const emailConfirm = document.getElementById('emailConfirm');

function checarEmails() {
    if (emailConfirm.value !== "" && emailInput.value !== emailConfirm.value) {
        emailConfirm.classList.add('is-invalid');
        document.getElementById('btnEnviar').disabled = true;
    } else {
        emailConfirm.classList.remove('is-invalid');
        document.getElementById('btnEnviar').disabled = false;
    }
}

emailInput.addEventListener('blur', checarEmails);
emailConfirm.addEventListener('blur', checarEmails);
// O navegador bloqueia atalhos de 'copiar e colar' no campo de confirmação para forçar a digitação
emailConfirm.addEventListener('paste', e => e.preventDefault());
    </script>
</body>
</html>
